<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>우리 반 공동구매</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                "Apple SD Gothic Neo", sans-serif;
            background: #f7f8fc;
            color: #202124;
        }

        .header {
            background: white;
            padding: 24px 20px 18px;
            border-bottom: 1px solid #eee;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 24px 18px 50px;
        }

        .welcome {
            background: #202124;
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .welcome p {
            margin: 0 0 8px;
            font-size: 14px;
            opacity: .75;
        }

        .welcome h2 {
            margin: 0;
            font-size: 23px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 14px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        .emoji {
            font-size: 30px;
        }

        .status {
            float: right;
            background: #eef7ee;
            color: #3d8b40;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.closed {
            background: #eee;
            color: #777;
        }

        .card h3 {
            margin: 13px 0 6px;
            font-size: 17px;
        }

        .card p {
            margin: 4px 0;
            color: #777;
            font-size: 13px;
        }

        .button {
            width: 100%;
            border: none;
            background: #202124;
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .form {
            display: none;
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
        }

        .form input {
            width: 100%;
            padding: 13px;
            margin: 7px 0 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        .form label {
            font-size: 13px;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            color: #777;
        }

        .closed-message {
            background: #eee;
            color: #666;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>📦 우리 반 공동구매</h1>
    <p>필요한 물건을 함께 구매해요!</p>
</header>


<main class="container">

    <section class="welcome">
        <p>WELCOME 👋</p>

        <h2>
            우리 반에서 필요한 물건,<br>
            함께 구매해요.
        </h2>
    </section>


    <div id="closedMessage"
         class="closed-message"
         style="display:none;">
        🚫 공동구매가 마감되었습니다.
    </div>


    <h2 class="section-title">
        🛒 진행 중인 공동구매
    </h2>


    <div id="productList">
        불러오는 중...
    </div>


    <div class="form" id="applicationForm">

        <h3 id="selectedProduct">
            공동구매 신청
        </h3>


        <label>
            이름
        </label>

        <input
            id="name"
            type="text"
            placeholder="이름을 입력해주세요"
        >


        <label>
            수량
        </label>

        <input
            id="quantity"
            type="number"
            min="1"
            value="1"
        >


        <button
            class="button"
            id="submitButton"
            onclick="submitApplication()"
        >
            공동구매 신청
        </button>


        <div
            class="message"
            id="message"
        ></div>

    </div>

</main>


<script type="module">

    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        serverTimestamp,
        doc,
        getDoc,
        query,
        where
    }
    from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyDCyA-OWIIWP8rp0N2rP7bVlVZepjq1jBk",

        authDomain:
            "classmarket-d9c78.firebaseapp.com",

        projectId:
            "classmarket-d9c78",

        storageBucket:
            "classmarket-d9c78.firebasestorage.app",

        messagingSenderId:
            "448581710198",

        appId:
            "G-B89J11PS8J"
    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    let selectedProduct = "";

    let isClosed = false;


    /*
     * 상품 불러오기
     */

    async function loadProducts() {

        const productList =
            document.getElementById(
                "productList"
            );


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "products"
                    )
                );


            productList.innerHTML = "";


            if (snapshot.empty) {

                productList.innerHTML = `
                    <div class="empty">
                        아직 등록된 공동구매가 없어요.
                    </div>
                `;

                return;
            }


            for (
                const productDoc
                of snapshot.docs
            ) {

                const data =
                    productDoc.data();


                const productName =
                    data.name || "상품";


                const emoji =
                    data.emoji || "📦";


                const count =
                    await getApplicationCount(
                        productName
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                card.innerHTML = `

                    <span class="emoji">
                        ${escapeHtml(emoji)}
                    </span>

                    <span class="status">
                        ${isClosed ? "마감" : "모집중"}
                    </span>

                    <h3>
                        ${escapeHtml(productName)}
                    </h3>

                    <p>
                        현재 신청 인원:
                        ${count}명
                    </p>

                    <button
                        class="button"
                        ${isClosed ? "disabled" : ""}
                    >
                        ${isClosed
                            ? "마감되었습니다"
                            : "신청하기 →"}
                    </button>

                `;


                const button =
                    card.querySelector(
                        ".button"
                    );


                if (!isClosed) {

                    button.addEventListener(
                        "click",
                        () => {

                            openForm(
                                productName
                            );

                        }
                    );

                }


                productList.appendChild(
                    card
                );

            }

        } catch (error) {

            console.error(error);

            productList.innerHTML = `
                <div class="empty">
                    상품을 불러오지 못했어요.
                </div>
            `;

        }

    }


    /*
     * 상품별 신청 인원
     */

    async function getApplicationCount(
        productName
    ) {

        try {

            const q =
                query(
                    collection(
                        db,
                        "applications"
                    ),
                    where(
                        "product",
                        "==",
                        productName
                    )
                );


            const snapshot =
                await getDocs(q);


            return snapshot.size;

        } catch (error) {

            console.error(error);

            return 0;

        }

    }


    /*
     * 마감 여부 확인
     */

    async function checkClosed() {

        try {

            const statusDoc =
                await getDoc(
                    doc(
                        db,
                        "settings",
                        "status"
                    )
                );


            if (
                statusDoc.exists() &&
                statusDoc.data().closed === true
            ) {

                isClosed = true;


                document
                    .getElementById(
                        "closedMessage"
                    )
                    .style.display =
                        "block";

            }

        } catch (error) {

            console.error(error);

        }

    }


    /*
     * 신청 폼 열기
     */

    window.openForm =
        function(product) {

            if (isClosed) {

                return;

            }


            selectedProduct =
                product;


            document
                .getElementById(
                    "selectedProduct"
                )
                .textContent =
                    product + " 신청";


            document
                .getElementById(
                    "applicationForm"
                )
                .style.display =
                    "block";


            document
                .getElementById(
                    "applicationForm"
                )
                .scrollIntoView({
                    behavior: "smooth"
                });

        };


    /*
     * 신청하기
     */

    window.submitApplication =
        async function() {

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const quantity =
                Number(
                    document
                        .getElementById("quantity")
                        .value
                );


            const message =
                document
                    .getElementById("message");


            if (isClosed) {

                message.textContent =
                    "🚫 공동구매가 마감되었습니다.";

                return;

            }


            if (!selectedProduct) {

                message.textContent =
                    "상품을 먼저 선택해주세요.";

                return;

            }


            if (!name) {

                message.textContent =
                    "이름을 입력해주세요.";

                return;

            }


            if (!quantity || quantity < 1) {

                message.textContent =
                    "수량을 확인해주세요.";

                return;

            }


            try {

                /*
                 * 신청 직전에 다시 마감 여부 확인
                 */

                const statusDoc =
                    await getDoc(
                        doc(
                            db,
                            "settings",
                            "status"
                        )
                    );


                if (
                    statusDoc.exists() &&
                    statusDoc.data().closed === true
                ) {

                    isClosed = true;

                    message.textContent =
                        "🚫 공동구매가 마감되었습니다.";

                    await loadProducts();

                    return;

                }


                await addDoc(
                    collection(
                        db,
                        "applications"
                    ),
                    {
                        product:
                            selectedProduct,

                        name:
                            name,

                        quantity:
                            quantity,

                        createdAt:
                            serverTimestamp()
                    }
                );


                message.textContent =
                    "✅ 신청이 완료되었습니다!";


                document
                    .getElementById("name")
                    .value = "";


                document
                    .getElementById("quantity")
                    .value = 1;


                await loadProducts();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "신청에 실패했습니다. 잠시 후 다시 시도해주세요.";

            }

        };


    /*
     * HTML 안전 처리
     */

    function escapeHtml(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /*
     * 시작
     */

    await checkClosed();

    await loadProducts();

</script>

</body>
</html>
