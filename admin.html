<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>공동구매 관리자</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", sans-serif;
      color: #202124;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 30px 18px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #202124;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close-button {
      margin-top: 10px;
      background: #d93025;
    }

    .error {
      color: #d93025;
      font-size: 13px;
      margin-top: 10px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .summary-card {
      background: #f7f8fc;
      border-radius: 14px;
      padding: 16px;
    }

    .summary-card .number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small {
      color: #777;
      font-size: 13px;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }

    .item:first-child {
      border-top: 0;
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    #adminArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 로그인 -->

  <div id="loginArea" class="box">

    <h1>🔐 관리자 로그인</h1>

    <input
      id="email"
      type="email"
      placeholder="관리자 이메일"
    >

    <input
      id="password"
      type="password"
      placeholder="비밀번호"
    >

    <button id="loginButton">
      로그인
    </button>

    <div id="error" class="error"></div>

  </div>


  <!-- 관리자 화면 -->

  <div id="adminArea">

    <div class="box">

      <h1>📦 공동구매 관리</h1>

      <p class="small" id="userEmail"></p>

      <button id="logoutButton">
        로그아웃
      </button>

      <button
        id="closeButton"
        class="close-button"
      >
        🚫 공동구매 마감
      </button>

    </div>


    <!-- 통계 -->

    <div class="box">

      <h2>📊 공동구매 현황</h2>

      <div class="summary">

        <div class="summary-card">

          <div class="small">
            총 신청자
          </div>

          <div
            class="number"
            id="totalPeople"
          >
            0
          </div>

        </div>


        <div class="summary-card">

          <div class="small">
            총 신청 수량
          </div>

          <div
            class="number"
            id="totalQuantity"
          >
            0
          </div>

        </div>

      </div>


      <div id="productSummary">
        불러오는 중...
      </div>

    </div>


    <!-- 신청 목록 -->

    <div class="box">

      <h2>📋 신청 목록</h2>

      <div id="applications">
        불러오는 중...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    setDoc
  } from
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  // Firebase 설정

  const firebaseConfig = {

    apiKey: "AIzaSyDCyA-OWIIWP8rp0N2rP7bVlVZepjq1jBk",
    authDomain: "classmarket-d9c78.firebaseapp.com",
    projectId: "classmarket-d9c78",
    storageBucket: "classmarket-d9c78.firebasestorage.app",
    messagingSenderId: "448581710198",
    appId: "G-B89J11PS8J"

  };


  // Firebase 시작

  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  // 화면 요소

  const loginArea =
    document.getElementById("loginArea");


  const adminArea =
    document.getElementById("adminArea");


  const error =
    document.getElementById("error");


  const applications =
    document.getElementById("applications");


  const productSummary =
    document.getElementById("productSummary");


  // 로그인

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      error.textContent = "";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (e) {

        console.error(e);

        error.textContent =
          "로그인에 실패했어요. 이메일과 비밀번호를 확인해주세요.";

      }

    });


  // 로그아웃

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await signOut(auth);

    });


  // 공동구매 마감

  document
    .getElementById("closeButton")
    .addEventListener("click", async () => {

      const confirmed =
        confirm(
          "공동구매를 마감할까요?\n마감 후에는 학생들이 신청할 수 없게 됩니다."
        );


      if (!confirmed) {
        return;
      }


      try {

        await setDoc(
          doc(db, "settings", "status"),
          {
            closed: true
          }
        );


        alert(
          "공동구매가 마감되었습니다."
        );


      } catch (e) {

        console.error(e);

        alert(
          "마감 처리에 실패했습니다."
        );

      }

    });


  // 로그인 상태 확인

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        loginArea.style.display =
          "block";

        adminArea.style.display =
          "none";

        return;

      }


      loginArea.style.display =
        "none";

      adminArea.style.display =
        "block";


      document
        .getElementById("userEmail")
        .textContent =
          user.email;


      await loadApplications();

    }
  );


  // 신청 데이터 불러오기

  async function loadApplications() {

    try {

      const q =
        query(
          collection(
            db,
            "applications"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        applications.textContent =
          "아직 신청자가 없어요.";

        productSummary.textContent =
          "아직 신청자가 없어요.";

        return;

      }


      applications.innerHTML = "";


      const productData = {};


      let totalPeople = 0;

      let totalQuantity = 0;


      snapshot.forEach(
        (docSnapshot) => {

          const data =
            docSnapshot.data();


          const product =
            data.product || "상품 없음";


          const name =
            data.name || "이름 없음";


          const quantity =
            Number(data.quantity) || 0;


          totalPeople += 1;

          totalQuantity += quantity;


          if (!productData[product]) {

            productData[product] = {

              people: 0,

              quantity: 0

            };

          }


          productData[product].people += 1;

          productData[product].quantity += quantity;


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "item";


          item.innerHTML = `

            <div class="product-name">
              ${escapeHtml(product)}
            </div>

            <div>
              신청자:
              ${escapeHtml(name)}
            </div>

            <div>
              수량:
              ${quantity}개
            </div>

          `;


          applications.appendChild(
            item
          );

        }
      );


      // 전체 통계

      document
        .getElementById(
          "totalPeople"
        )
        .textContent =
          totalPeople;


      document
        .getElementById(
          "totalQuantity"
        )
        .textContent =
          totalQuantity;


      // 상품별 통계

      productSummary.innerHTML = "";


      Object.entries(
        productData
      ).forEach(
        ([product, data]) => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "summary-card";


          div.style.marginTop =
            "10px";


          div.innerHTML = `

            <strong>
              ${escapeHtml(product)}
            </strong>

            <div class="small">
              ${data.people}명 신청 ·
              총 ${data.quantity}개
            </div>

          `;


          productSummary.appendChild(
            div
          );

        }
      );


    } catch (e) {

      console.error(e);

      applications.textContent =
        "신청 목록을 불러오지 못했어요.";

      productSummary.textContent =
        "통계를 불러오지 못했어요.";

    }

  }


  // HTML 안전 처리

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }

</script>

</body>
</html>
