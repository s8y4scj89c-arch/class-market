<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공동구매 관리자</title>

  <style>
    body {
      margin: 0;
      background: #f7f8fc;
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", sans-serif;
      color: #202124;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 30px 18px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #202124;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      color: #d93025;
      font-size: 13px;
      margin-top: 10px;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }

    .item:first-child {
      border-top: 0;
    }

    .small {
      color: #777;
      font-size: 13px;
    }

    #adminArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginArea" class="box">
    <h1>🔐 관리자 로그인</h1>

    <input id="email"
           type="email"
           placeholder="관리자 이메일">

    <input id="password"
           type="password"
           placeholder="비밀번호">

    <button id="loginButton">로그인</button>

    <div id="error" class="error"></div>
  </div>


  <div id="adminArea">

    <div class="box">
      <h1>📦 공동구매 관리</h1>
      <p class="small" id="userEmail"></p>

      <button id="logoutButton">로그아웃</button>
    </div>

    <div class="box">
      <h2>📋 신청 목록</h2>
      <div id="applications">
        불러오는 중...
      </div>
    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  // Firebase 콘솔에서 사용했던 설정값을 넣어주세요.
  const firebaseConfig = {
    apiKey: "AIzaSyDCyA-OWIIWP8rp0N2rP7bVlVZepjq1jBk",
    authDomain: "classmarket-d9c78.firebaseapp.com",
    projectId: "classmarket-d9c78",
    storageBucket: "classmarket-d9c78.firebasestorage.app",
    messagingSenderId: "448581710198",
    appId: "G-B89J11PS8J"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);
  const db = getFirestore(app);


  const loginArea =
    document.getElementById("loginArea");

  const adminArea =
    document.getElementById("adminArea");

  const error =
    document.getElementById("error");

  const applications =
    document.getElementById("applications");


  document.getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      error.textContent = "";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (e) {

        error.textContent =
          "로그인에 실패했어요. 이메일과 비밀번호를 확인해주세요.";

      }

    });


  document.getElementById("logoutButton")
    .addEventListener("click", async () => {

      await signOut(auth);

    });


  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      loginArea.style.display = "block";
      adminArea.style.display = "none";

      return;
    }


    loginArea.style.display = "none";
    adminArea.style.display = "block";

    document.getElementById("userEmail")
      .textContent = user.email;


    await loadApplications();

  });


  async function loadApplications() {

    applications.textContent =
      "신청 목록을 불러오는 중...";


    try {

      const q = query(
        collection(db, "applications"),
        orderBy("createdAt", "desc")
      );

      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        applications.textContent =
          "아직 신청자가 없어요.";

        return;
      }


      applications.innerHTML = "";

      snapshot.forEach((doc) => {

        const data = doc.data();

        const item =
          document.createElement("div");

        item.className = "item";

        item.innerHTML = `
          <strong>${escapeHtml(data.product)}</strong>
          <br>
          신청자: ${escapeHtml(data.name)}
          <br>
          수량: ${data.quantity}개
        `;

        applications.appendChild(item);

      });

    } catch (e) {

      console.error(e);

      applications.textContent =
        "신청 목록을 불러오지 못했어요.";

    }

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
